<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MahaGuru AI helps college students in India move from confusion to clarity: a reflective AI mentor and a personalised AI classroom, in one place." />
    <meta name="theme-color" content="#1D4ED8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>MahaGuru AI | Career clarity and personalised learning for students</title>
    <script>
      try {
        const t = localStorage.getItem('mg-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

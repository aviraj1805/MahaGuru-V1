name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: mg, POSTGRES_PASSWORD: mg, POSTGRES_DB: mahaguru_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mg -d mahaguru_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/build_dataset.py
      - name: Exemplar library is up to date
        run: git diff --exit-code app/services/studentgpt/data/exemplars.jsonl
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Migrations apply cleanly on a fresh PostgreSQL database
        run: uv run alembic upgrade head
        env: { ENV: test, LLM_PROVIDER: fake, DATABASE_URL: "postgresql://mg:mg@localhost:5432/mahaguru_test" }
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env: { TEST_DATABASE_URL: "postgresql+asyncpg://mg:mg@localhost:5432/mahaguru_test" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results }

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mahaguru:ci .
